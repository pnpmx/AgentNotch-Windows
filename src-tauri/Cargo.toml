[package]
name = "agentnotch"
version = "0.1.0"
description = "Edge-docked usage widget for Codex and Claude with local push-to-talk dictation"
authors = ["AgentNotch contributors"]
license = "MIT"
repository = "https://github.com/pnpmx/AgentNotch-Windows"
edition = "2021"
rust-version = "1.88"

[lib]
name = "agentnotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "7"
cpal = "0.18"
whisper-rs = "0.16"
ureq = "3"
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["global_shortcuts"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

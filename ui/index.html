<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentNotch</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="root" class="edge-right collapsed">
    <div id="tab" class="tab" role="button" tabindex="-1">
      <span id="attention" class="attention" hidden></span>
      <svg id="orbit" class="orbit" aria-hidden="true"></svg>
      <div class="chip" data-source="codex">
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="14"/>
          <circle class="value" cx="18" cy="18" r="14"/>
        </svg>
        <span class="chip-value">--</span>
      </div>
      <div id="mic" class="mic" data-state="idle" aria-hidden="true"></div>
      <div class="chip" data-source="claude">
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="14"/>
          <circle class="value" cx="18" cy="18" r="14"/>
        </svg>
        <span class="chip-value">--</span>
      </div>
    </div>

    <section id="panel" class="panel" hidden>
      <header id="panel-header">
        <div id="mic-large" class="mic" data-state="idle" aria-hidden="true"></div>
        <span id="speech-label"></span>
        <button id="settings-toggle" class="icon" type="button" data-i18n-title="settings">⚙</button>
        <button id="close" class="icon" type="button" data-i18n-title="close">✕</button>
      </header>

      <div id="alerts" class="alerts" aria-live="polite"></div>

      <div id="main-view">
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="sessions"><span data-i18n="sessions.title"></span><span id="unread-badge" class="badge" hidden></span></button>
          <button type="button" role="tab" data-tab="limits" data-i18n="tabs.limits"></button>
          <button type="button" role="tab" data-tab="voice" data-i18n="tabs.voice"></button>
        </nav>

        <div id="tab-sessions" class="tab-body">
          <p id="sessions-empty" class="empty" data-i18n="sessions.empty"></p>
          <div id="sessions" class="sessions"></div>
          <button id="sessions-more" class="linklike more" type="button" hidden></button>
        </div>

        <div id="tab-limits" class="tab-body" hidden>
          <div class="columns">
            <div class="column" data-source="codex"><h2>Codex</h2><div class="body"></div></div>
            <div class="column" data-source="claude">
              <h2>Claude Code</h2>
              <p id="session" class="session"></p>
              <div class="body"></div>
            </div>
          </div>
          <div class="actions">
            <button id="wrapped-open" type="button" data-i18n="wrapped.button"></button>
            <span class="spacer"></span>
            <button id="refresh" class="icon" type="button" data-i18n-title="refresh">↻</button>
          </div>
        </div>

        <div id="tab-voice" class="tab-body" hidden>
          <p id="voice-empty" class="empty" data-i18n="voice.empty"></p>
          <ol id="history" class="history"></ol>
        </div>
      </div>

      <div id="setup" class="actions setup" hidden>
        <button id="connect" type="button" data-i18n="connectClaude" hidden></button>
        <button id="connect-agents" type="button" data-i18n="agents.connect" hidden></button>
      </div>

      <p id="notice" aria-live="polite"></p>

      <div id="settings" hidden>
        <h3 data-i18n="settings.agentDefaults"></h3>
        <label>Claude Code</label>
        <div class="segmented" id="claude-model"></div>
        <div class="segmented effort" id="claude-effort"></div>
        <label>Codex</label>
        <div class="segmented" id="codex-model"></div>
        <div class="segmented effort" id="codex-effort"></div>
        <p class="hint" data-i18n="settings.newSessionsHint"></p>

        <h3 data-i18n="settings.alerts"></h3>
        <label class="check"><input type="checkbox" id="limit-alerts" /> <span data-i18n="settings.limitAlerts"></span></label>
        <label class="check"><input type="checkbox" id="agent-alerts" /> <span data-i18n="settings.agentAlerts"></span></label>

        <h3 data-i18n="settings.dictationOptions"></h3>
        <label for="vocabulary" data-i18n="settings.vocabulary"></label>
        <input id="vocabulary" type="text" maxlength="600" spellcheck="false" autocomplete="off" />
        <label class="check"><input type="checkbox" id="auto-enter" /> <span data-i18n="settings.autoEnter"></span></label>
        <label class="check"><input type="checkbox" id="remove-fillers" /> <span data-i18n="settings.removeFillers"></span></label>

        <h3 data-i18n="settings.interface"></h3>
        <div class="segmented" id="ui-language"></div>
        <label data-i18n="settings.dictation"></label>
        <div class="segmented" id="dictation-language"></div>
        <label data-i18n="settings.model"></label>
        <div class="segmented" id="model"></div>
      </div>
    </section>

    <div id="drop-hint" class="drop-hint" hidden><span data-i18n="drop.hint"></span></div>

    <div id="wrapped" class="wrapped" hidden>
      <img id="wrapped-image" alt="" />
      <p id="wrapped-status"></p>
      <div class="wrapped-actions">
        <button id="wrapped-save" type="button" data-i18n="wrapped.save"></button>
        <button id="wrapped-show" type="button" data-i18n="wrapped.show" hidden></button>
        <span class="spacer"></span>
        <button id="wrapped-close" class="icon" type="button" data-i18n-title="close">✕</button>
      </div>
    </div>
  </div>
</body>
</html>
